name: Build Nila APK
on:
  push:
    branches: [main]
    paths: ['nila-android/**', '.github/workflows/nila-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: nila-apk, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build APK
        working-directory: nila-android
        run: gradle --no-daemon assembleRelease
      - name: Publish APK to the site
        run: |
          cp nila-android/app/build/outputs/apk/release/app-release.apk nila/nila-ai.apk
          git config user.name "nila-build"
          git config user.email "nila-build@users.noreply.github.com"
          git add nila/nila-ai.apk
          git commit -m "Nila APK build ${GITHUB_SHA::7}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
